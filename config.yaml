# doorRelay monitor configuration

# Phone numbers (or iMessage emails) allowed to open the door, mapped to a name
# (the name is used when importing contacts in prod).
# Matching ignores formatting — "+1 (650) 555-1234", "6505551234", etc. all
# compare by their last 10 digits. Emails are matched exactly (lowercased).
authorized_senders:
  "+15175758327": michael
  "+14088932795": welton
  "+14159716732": thijs
  "+15038471298": alan
  "+16462808966": james
  "+13175297439": hannah
  "+15714588718": jag

# The word that triggers the door. Matched case-insensitively anywhere in the
# message, so "open", "OPEN", "Open the door", and even "reopen" all trigger.
trigger_word: "open"

# ESP32 relay WebSocket server (from relay.ino: local_IP + WS_PORT).
relay:
  host: "192.168.0.67"
  port: 81
  # Shared HMAC secret. This is NEVER sent over the wire — it signs a fresh
  # nonce the relay issues each time. MUST match SHARED_SECRET in relay.ino.
  secret: "k9$Wm2!qR7#zP4@xL8&"

# How often to check chat.db for new messages, in seconds.
poll_interval: 1

# Optionally text the sender back after a trigger. The first reply pops a
# one-time macOS Automation prompt: allow your terminal to control Messages
# (System Settings > Privacy & Security > Automation).
reply:
  enabled: true
  on_open: "🚪 Door opened."
  on_fail: "⚠️ Couldn't reach the door relay."

# When an authorized sender texts the setup trigger word, reply with the
# Shortcut link so they can add it. Matched case-insensitively anywhere in the
# message, like the open trigger.
setup:
  enabled: true
  trigger_word: "setup"
  message: "To open the door, add this Shortcut 👇"
  shortcut_url: "https://www.icloud.com/shortcuts/74a72e0e1fcb4b6eb5520ae692a0347e"
